<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aamurutiinit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* Sovelluskohtaiset tyylit, jotka käyttävät style.css:n muuttujia */
  main { padding-block: 3rem; }
  .count { margin-bottom: 1.5rem; }

  .add { display: flex; gap: 0.6rem; margin-bottom: 1.25rem; }
  .add input { flex: 1; min-width: 0; border-radius: 999px; padding-inline: 1.2rem; }

  ul { list-style: none; display: grid; gap: 0.6rem; margin-bottom: 1.25rem; }

  li {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.7rem 0.7rem 0.7rem 1.1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
  }

  li label { flex: 1; display: flex; align-items: center; gap: 0.9rem; cursor: pointer; min-width: 0; }

  /* Ylikirjoittaa style.css:n yleisen input-tyylin valintaruuduille */
  li input[type="checkbox"] {
    appearance: none;
    flex: none;
    width: 1.5rem;
    height: 1.5rem;
    padding: 0;
    border: 2px solid var(--accent);
    border-radius: 7px;
    display: grid;
    place-content: center;
    cursor: pointer;
  }

  li input[type="checkbox"]::after {
    content: "";
    width: 0.35rem;
    height: 0.7rem;
    border: solid #fff;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg) scale(0);
    transition: transform 0.15s ease;
    margin-top: -2px;
  }

  li input[type="checkbox"]:checked { background: var(--accent); }
  li input[type="checkbox"]:checked::after { transform: rotate(45deg) scale(1); }

  li span { overflow-wrap: anywhere; }
  li.done span { color: var(--muted); text-decoration: line-through; }
  li.empty { display: block; text-align: center; color: var(--muted); border: none; background: none; }

  .del {
    flex: none;
    width: 2rem;
    height: 2rem;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-size: 1.2rem;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .del:hover { background: var(--border); color: var(--text); }

  .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .filters .btn { padding: 0.45rem 1.1rem; font-size: 0.9rem; }
  .filters .btn[aria-pressed="true"] { background: var(--accent); color: #fff; }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main class="container">
  <h1>Aamurutiinit</h1>
  <p class="count" id="count" aria-live="polite"></p>

  <form class="add" id="add-form">
    <input type="text" id="new-task" placeholder="Lisää rutiini" aria-label="Lisää rutiini" autocomplete="off">
    <button type="submit" class="btn">+ Lisää</button>
  </form>

  <ul id="list"></ul>

  <div class="filters" role="group" aria-label="Suodata rutiinit">
    <button type="button" class="btn btn-outline" data-filter="all" aria-pressed="true">Kaikki</button>
    <button type="button" class="btn btn-outline" data-filter="active" aria-pressed="false">Aktiiviset</button>
    <button type="button" class="btn btn-outline" data-filter="done" aria-pressed="false">Tehty</button>
  </div>
</main>

<script>
  const KEY = "aamurutiinit";
  const defaults = [
    { id: 1, text: "Hampaiden harjaus", done: false },
    { id: 2, text: "Syö aamupala", done: false },
    { id: 3, text: "Petaa sänky", done: false }
  ];

  let tasks = load();
  let filter = "all";

  const list = document.getElementById("list");
  const form = document.getElementById("add-form");
  const input = document.getElementById("new-task");
  const count = document.getElementById("count");

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(saved)) return saved;
    } catch (e) {}
    return defaults;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  function render() {
    const shown = tasks.filter(t =>
      filter === "all" ? true : filter === "done" ? t.done : !t.done
    );

    list.innerHTML = "";

    if (!shown.length) {
      const p = document.createElement("li");
      p.className = "empty";
      p.textContent = tasks.length
        ? "Ei rutiineja tässä näkymässä."
        : "Ei rutiineja vielä. Lisää ensimmäinen yllä.";
      list.appendChild(p);
    }

    shown.forEach(t => {
      const li = document.createElement("li");
      if (t.done) li.className = "done";

      const label = document.createElement("label");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = t.done;
      box.addEventListener("change", () => {
        t.done = box.checked;
        save();
        render();
      });

      const text = document.createElement("span");
      text.textContent = t.text;
      label.append(box, text);

      const del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.setAttribute("aria-label", "Poista rutiini: " + t.text);
      del.textContent = "×";
      del.addEventListener("click", () => {
        tasks = tasks.filter(x => x.id !== t.id);
        save();
        render();
      });

      li.append(label, del);
      list.appendChild(li);
    });

    const done = tasks.filter(t => t.done).length;
    count.textContent = tasks.length ? done + " / " + tasks.length + " tehty" : "";
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ id: Date.now(), text, done: false });
    input.value = "";
    save();
    render();
  });

  document.querySelectorAll(".filters button").forEach(btn => {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      document.querySelectorAll(".filters button").forEach(b =>
        b.setAttribute("aria-pressed", b === btn)
      );
      render();
    });
  });

  render();
</script>
</body>
</html>
