<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aamutsekki</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Aamutsekki ☀️</h1>

    <!-- Lomake -->
    <form id="add-form">
      <input id="new-task" type="text" placeholder="Lisää uusi rutiini" aria-label="Uusi rutiini" autocomplete="off">
      <button type="submit" class="btn">Lisää</button>
    </form>

    <!-- Suodatinpainikkeet -->
    <div class="filters">
      <button type="button" data-filter="all">Kaikki</button>
      <button type="button" data-filter="active">Aktiiviset</button>
      <button type="button" data-filter="done">Tehty</button>
    </div>

    <!-- Rutiinilista -->
    <ul id="list"></ul>

<!-- Laskuri -->
    <p id="count"></p>
  </main>
</body>
</html>
